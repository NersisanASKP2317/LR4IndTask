# ============================================================
# БЛОК 1. ОПРЕДЕЛЕНИЕ СЕРВИСОВ (КОНТЕЙНЕРОВ)
# ============================================================

services:

  # --------------------------------------------------------
  # БЛОК 1.1. NGINX - ВЕБ-СЕРВЕР (ПРОКСИ)
  # --------------------------------------------------------
  nginx:
    image: nginx:alpine                    # официальный образ nginx на Alpine Linux
    ports:
      - "80:80"                            # проброс порта 80 хоста на порт 80 контейнера
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # монтирование конфигурации nginx
    depends_on:
      - app                                # запускать после app
    networks:
      - security-net                       # подключение к сети security-net

  # --------------------------------------------------------
  # БЛОК 1.2. APP - FLASK-ПРИЛОЖЕНИЕ (УБИ.167)
  # --------------------------------------------------------
  app:
    build:
      context: .                           # контекст сборки (текущая папка)
      dockerfile: Dockerfile.app           # использование Dockerfile.app
    ports:
      - "5000:5000"                        # проброс порта 5000 для отладки API
    networks:
      - security-net

  # --------------------------------------------------------
  # БЛОК 1.3. DB - ПОСТГРЕС (БАЗА ДАННЫХ)
  # --------------------------------------------------------
  db:
    image: postgres:13                     # официальный образ PostgreSQL 13
    environment:                           # переменные окружения для БД
      POSTGRES_USER: user                  # имя пользователя БД
      POSTGRES_PASSWORD: password          # пароль
      POSTGRES_DB: security_db             # имя базы данных
    volumes:
      - dbdata:/var/lib/postgresql/data    # постоянное хранилище данных БД
    networks:
      - security-net

  # --------------------------------------------------------
  # БЛОК 1.4. PGADMIN - ВЕБ-ИНТЕРФЕЙС УПРАВЛЕНИЯ БД
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4                  # официальный образ pgAdmin
    ports:
      - "5050:80"                          # проброс порта 5050 для доступа к pgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  # email для входа
      PGADMIN_DEFAULT_PASSWORD: admin          # пароль для входа
    depends_on:
      - db                                 # запускать после db
    networks:
      - security-net

  # --------------------------------------------------------
  # БЛОК 1.5. PROMETHEUS - СБОР МЕТРИК
  # --------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest          # официальный образ Prometheus
    container_name: ub167-prometheus       # фиксированное имя контейнера
    ports:
      - "9090:9090"                        # проброс порта 9090 для доступа к Prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # монтирование конфигурации (только чтение)
      - prometheus_data:/prometheus        # постоянное хранилище метрик
    networks:
      - security-net
    restart: unless-stopped                # автоматический перезапуск при сбое

  # --------------------------------------------------------
  # БЛОК 1.6. GRAFANA - ВИЗУАЛИЗАЦИЯ МЕТРИК
  # --------------------------------------------------------
  grafana:
    image: grafana/grafana:latest          # официальный образ Grafana
    container_name: ub167-grafana          # фиксированное имя контейнера
    ports:
      - "3000:3000"                        # проброс порта 3000 для доступа к Grafana
    volumes:
      - grafana_data:/var/lib/grafana      # постоянное хранилище данных Grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro  # автоматическая настройка дашбордов
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # пароль администратора Grafana
      - GF_INSTALL_PLUGINS=grafana-piechart-panel  # установка плагина круговых диаграмм
    networks:
      - security-net
    restart: unless-stopped
    depends_on:
      - prometheus                         # запускать после prometheus


# ============================================================
# БЛОК 2. НАСТРОЙКА СЕТИ
# ============================================================

networks:
  security-net:
    driver: bridge                         # драйвер сети (мост)


# ============================================================
# БЛОК 3. ОБЪЯВЛЕНИЕ ТОМОВ (PERSISTENT STORAGE)
# ============================================================

volumes:
  dbdata:                                  # том для данных PostgreSQL
  prometheus_data:                         # том для метрик Prometheus
  grafana_data:                            # том для данных Grafana
