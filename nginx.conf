# ============================================================
# БЛОК 1. БАЗОВЫЕ НАСТРОЙКИ СЕРВЕРА
# ============================================================

server {                              # объявление серверного блока
    listen 80;                        # прослушивание порта 80 (стандартный HTTP)
    server_name localhost;            # имя сервера (для локального запуска)

# ============================================================
# БЛОК 2. ОБСЛУЖИВАНИЕ СТАТИЧЕСКОГО ВЕБ-ИНТЕРФЕЙСА
# ============================================================

    location / {                      # обработка всех запросов к корневой директории
        root /usr/share/nginx/html;   # путь к статическим файлам внутри контейнера
        index index.html;             # индексный файл (главная страница)
    }

# ============================================================
# БЛОК 3. ПРОКСИРОВАНИЕ ЗАПРОСОВ К API
# ============================================================

    location /api/check {             # обработка запросов, начинающихся с /api/check
        proxy_pass http://app:5000/check;  # перенаправление запросов на Flask-приложение (контейнер app, порт 5000)
        proxy_set_header Host $host;       # передача исходного заголовка Host
        proxy_set_header X-Real-IP $remote_addr;  # передача реального IP-адреса клиента
    }
}
