# ==============================================================
# БЛОК 1: ВЕРСИЯ API KUBERNETES
# Определяет, какой API использовать для создания объекта
# v1 - стабильная версия для базовых объектов (Pod, Service и т.д.)
# ==============================================================
apiVersion: v1

# ==============================================================
# БЛОК 2: ТИП ОБЪЕКТА
# Pod - минимальная единица развертывания в Kubernetes
# Один под может содержать несколько контейнеров, разделяющих:
# - сеть (localhost)
# - хранилище (volumes)
# ==============================================================
kind: Pod

# ==============================================================
# БЛОК 3: МЕТАДАННЫЕ (идентификация пода)
# name - уникальное имя пода в кластере
# labels - теги для поиска и группировки (например, для сервисов)
# ==============================================================
metadata:
  name: security-pod
  labels:
    app: ub167

# ==============================================================
# БЛОК 4: СПЕЦИФИКАЦИЯ ПОДА
# Описывает, какие контейнеры будут запущены внутри пода
# ==============================================================
spec:
  containers:
    
    # ----------------------------------------------------------
    # КОНТЕЙНЕР 1: NGINX (веб-сервер)
    # Отвечает за раздачу статических файлов (HTML, CSS, JS)
    # Порт 80 - HTTP-трафик
    # imagePullPolicy: Never - использовать локальный образ, не тянуть из реестра
    # ----------------------------------------------------------
    - name: nginx
      image: ub167-nginx:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 80

    # ----------------------------------------------------------
    # КОНТЕЙНЕР 2: APP (основное приложение контейнера УБИ.167)
    # Python-приложение (логика фильтрации URL, статистика, API)
    # Порт 5000 - внутренний API (взаимодействие с фронтендом)
    # ----------------------------------------------------------
    - name: app
      image: ub167-app:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 5000

    # ----------------------------------------------------------
    # КОНТЕЙНЕР 3: POSTGRES (база данных)
    # Хранит историю проверок, списки URL, пользователей
    # Переменные окружения задают пользователя, пароль и имя БД
    # ----------------------------------------------------------
    - name: db
      image: postgres:13
      env:
        - name: POSTGRES_USER
          value: "user"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "security_db"

    # ----------------------------------------------------------
    # КОНТЕЙНЕР 4: PGADMIN (инструмент управления БД)
    # Веб-интерфейс для администрирования PostgreSQL
    # Порт 80 - доступ к pgAdmin внутри пода
    # Переменные окружения - email и пароль для входа в pgAdmin
    # ----------------------------------------------------------
    - name: pgadmin
      image: dpage/pgadmin4
      ports:
        - containerPort: 80
      env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: "admin@example.com"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "admin"
